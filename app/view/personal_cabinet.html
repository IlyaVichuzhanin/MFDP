<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taxi Demand Predictor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar {
            transition: all 0.3s;
        }
        .sidebar.collapsed {
            width: 80px;
        }
        .sidebar.collapsed .sidebar-text {
            display: none;
        }
        .sidebar.collapsed .logo-text {
            display: none;
        }
        .main-content {
            transition: margin-left 0.3s;
        }
        .prediction-card {
            transition: transform 0.2s;
        }
        .prediction-card:hover {
            transform: translateY(-5px);
        }
        .chart-container {
            height: 300px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="flex h-screen overflow-hidden">
        <!-- Боковая панель -->
        <div class="sidebar bg-indigo-800 text-white w-64 flex flex-col">
            <div class="p-4 flex items-center space-x-2 border-b border-indigo-700">
                <i class="fas fa-taxi text-2xl"></i>
                <span class="logo-text text-xl font-bold">TaxiAI</span>
            </div>
            
            <div class="p-4 space-y-6 flex-grow">
                <div class="space-y-2">
                    <div class="sidebar-item bg-indigo-700 rounded-lg p-3 flex items-center space-x-3 cursor-pointer">
                        <i class="fas fa-home"></i>
                        <span class="sidebar-text">Главная</span>
                    </div>
                    <form action="/responses/get_user_predictions" method="get">
                        <a class="sidebar-item hover:bg-indigo-700 rounded-lg p-3 flex items-center space-x-3 cursor-pointer">
                            <i class="fas fa-file-alt">
                                <button type="submit">История предсказаний
                                
                                </button>
                            </i>
                        </a>
                    </form>
                </div>
            </div>
        </div>
        
        <!-- Основное содержимое -->
        <div class="main-content flex-1 overflow-auto">
            <div class="p-6">
                <!-- Заголовок и кнопки -->
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-gray-800">Прогнозирование спроса на такси</h1>
                </div>
                
                <!-- Форма прогнозирования -->
                <div class="bg-white rounded-xl shadow-md p-6 mb-6">
                    <h2 class="text-xl font-semibold mb-4 text-gray-800">Новый прогноз</h2>
                    <form method="post" action="/ml/get_prediction" enctype="application/x-www-form-urlencoded" class="flex flex-col md:flex-row gap-4 items-end mb-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Район</label>
                            <select name="cluster_number" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                <option value="0">0</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Дата</label>
                            <input name="trip_date" type="date" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Время</label>
                            <input name="trip_time" type="time" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" required>
                        </div>
                        <button type="submit" class="bg-indigo-600 text-white px-6 py-3 rounded-lg hover:bg-indigo-700 transition w-full md:w-auto">
                            <i class="fas fa-chart-bar mr-2"></i>Спрогнозировать спрос
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Сворачивание/разворачивание боковой панели
        document.getElementById('toggle-sidebar').addEventListener('click', function() {
            const sidebar = document.querySelector('.sidebar');
            sidebar.classList.toggle('collapsed');
            
            const icon = this.querySelector('i');
            if (sidebar.classList.contains('collapsed')) {
                icon.classList.remove('fa-chevron-left');
                icon.classList.add('fa-chevron-right');
            } else {
                icon.classList.remove('fa-chevron-right');
                icon.classList.add('fa-chevron-left');
            }
        });

        // Имитация загрузки данных для графика
        function simulateChartLoading() {
            const bars = document.querySelectorAll('.chart-container .bg-indigo-400');
            bars.forEach(bar => {
                const randomHeight = Math.floor(Math.random() * 100);
                bar.style.height = `${randomHeight}%`;
            });
        }

        // Запуск при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            simulateChartLoading();
            
            // Добавление обработчиков для элементов боковой панели
            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.addEventListener('click', function() {
                    document.querySelectorAll('.sidebar-item').forEach(i => {
                        i.classList.remove('bg-indigo-700');
                    });
                    this.classList.add('bg-indigo-700');
                });
            });
        });
    </script>
</body>
</html>
